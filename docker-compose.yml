services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: bindee
      POSTGRES_PASSWORD: bindee
      POSTGRES_DB: bindee
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
volumes:
  pgdata:
