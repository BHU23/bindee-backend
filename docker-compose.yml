services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: bindee
      POSTGRES_PASSWORD: bindee
      POSTGRES_DB: bindee
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bindee -d bindee"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7
    # Bound to localhost only: Redis is never exposed publicly.
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  pgdata:
  redisdata:
